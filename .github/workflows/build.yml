name: Build and Release Firmware

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Libraries
        run: |
          arduino-cli lib install "GxEPD2"
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
          arduino-cli lib install "Adafruit AHTX0"
          arduino-cli lib install "esp32FOTA"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3:FlashSize=4M,PartitionScheme=min_spiffs --output-dir ./build .

      - name: Rename firmware
        run: |
          mv ./build/*.ino.bin ./firmware.bin

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./firmware.bin
            ./version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
